<?xml version="1.0" encoding="utf-8"?>
<!-- CareSync logo wordmark (replaces the PurpleAdmin default) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 112" width="560" height="112" xml:space="preserve">
	<defs>
		<linearGradient id="cs-logo-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
			<stop offset="0%" style="stop-color:#5AB0FF"/>
			<stop offset="100%" style="stop-color:#4A7DFF"/>
		</linearGradient>
	</defs>
	<text x="0" y="86" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="86" font-weight="700" letter-spacing="1" fill="url(#cs-logo-gradient)">CareSync</text>
</svg>
